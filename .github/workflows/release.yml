name: Release

# Platform publishes versioned packages; products consume semantic versions.
# Tagging `v1.2.3` on main publishes every public package at that version to
# GitHub Packages, which is the registry the product repos are configured against.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve and pack without publishing'
        type: boolean
        default: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  publish:
    name: Publish @munaxa/* to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify
        run: pnpm test && pnpm validate

      # Stamp every publishable package with the tag's version so the platform and its
      # façades always ship as a matched set. A façade pinned to a different version of
      # the implementation than it was generated against is the one way this layout can
      # break consumers.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version $VERSION"
          pnpm -r --filter './packages/**' exec npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: pnpm -r --filter './packages/**' publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack only (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm -r --filter './packages/**' exec npm pack --dry-run
