name: Release

# Platform publishes every public package to GitHub Packages, the registry the
# product repos are configured against. Releases are dispatched manually; the
# version published is whatever each package.json declares.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve and pack without publishing'
        type: boolean
        default: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  publish:
    name: Publish @munaxa/* to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify
        run: pnpm test && pnpm validate

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: pnpm -r --filter './packages/**' --filter './tooling/**' publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack only (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm -r --filter './packages/**' --filter './tooling/**' exec npm pack --dry-run
