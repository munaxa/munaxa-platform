name: Release

# Platform publishes every public package to GitHub Packages, the registry the
# product repos are configured against. Releases are dispatched manually; the
# version published is whatever each package.json declares.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve and pack without publishing'
        type: boolean
        default: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  publish:
    name: Publish @munaxa/* to GitHub Packages
    runs-on: ubuntu-latest
    # The server-side control. workflow_dispatch runs the workflow file as it exists on the chosen
    # ref, so a branch can carry a copy of this file without the step below. The package-release
    # environment must be configured in the repository settings with a deployment branch policy of
    # main only and a required reviewer; GitHub then refuses the job from any other ref whatever the
    # file says. Until it is configured, GitHub creates it unprotected and only the step below applies.
    environment: package-release
    permissions:
      contents: read
      packages: write
    steps:
      # A publish replaces nothing (a version is published once), so the version a consumer gets
      # must be the one reviewed on main. This step stops an accidental publish from another ref
      # (a dry run may use any ref); it is not a control on its own, see the environment above.
      - name: Refuse to publish from a ref other than main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Publishing is only allowed from refs/heads/main (got $REF). Re-run with dry_run, or dispatch on main."
          exit 1

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify
        run: pnpm test && pnpm validate

      # The manifest gate (`pnpm release:check`): exports targets exist, lockstep versions agree,
      # no build-time package in runtime dependencies. `pnpm release` runs it before publishing;
      # this workflow publishes with `pnpm -r publish`, so it has to run it itself.
      - name: Release manifest check
        run: pnpm release:check

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: pnpm -r --filter './packages/**' --filter './tooling/**' publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack only (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm -r --filter './packages/**' --filter './tooling/**' exec npm pack --dry-run
