# On-demand Testing sessions for the shared stack's nonprod environment (owner decision, 29 Oct
# 2026: Testing at US$50 a month or less, so nothing runs between sessions).
#
#   up:    plan edge_enabled=true and services_enabled=true, check it, start the database, apply
#   down:  apply both false (the ALB and every service are deleted), then stop the database; the
#          database is stopped even when that plan or apply fails, so drift never leaves it running
#
# A session has a hard limit: the scheduled runs below take every session down every evening, and
# RDS restarts a stopped instance by itself after seven days, which the same schedule stops again.
# GitHub starts scheduled runs late (3 to 6 hours observed on '0 20 * * *'), so there are two, off
# the hour. AWS has its own backstop that does not depend on GitHub: EventBridge Scheduler stops
# the database and scales every service to 0 at 21:00 UTC (infra/aws/stack/backstop.tf).
#
# On `down` the database is stopped by its own job, outside the Terraform concurrency group: a
# nonprod plan or apply that waits for its approval holds that group (and GitHub keeps only one
# pending run per group, cancelling the older one), but never delays the database stop.
# Only nonprod. Production is never started or stopped here.
#
# Until the nonprod stack has been applied (G3) its state object does not exist: `down` then ends
# green with a notice and `up` fails. The OIDC and deployer steps still run every night (they
# verify the roles). Any other answer than "exists" or "not found" fails the job.
#
# The session changes only the two switches: the plan must contain nothing but the ALB, listeners,
# listener rules, target groups, ALB egress rules, ECS services and service-discovery entries, or
# the job stops before applying. The plan's attribute values are not printed (public logs): the
# summary lists addresses and actions only, and Terraform's errors still reach the log.

name: AWS Testing session

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'up starts Testing, down stops it'
        required: true
        type: choice
        options: [up, down]
  schedule:
    # The backstop: every evening, down. Off the hour (GitHub's busiest minute), and twice.
    - cron: '17 19 * * *'
    - cron: '47 1 * * *'

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.16.5
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: '229251310592'
  DB_INSTANCE: munaxa-nonprod-pg

jobs:
  # `down` only: stop the database first, whatever happens to the switches below.
  database:
    name: Stop the database
    if: github.ref == 'refs/heads/main' && vars.AWS_CI_ROLE_ARN != '' && (inputs.session || 'down') == 'down'
    runs-on: ubuntu-latest
    timeout-minutes: 45 # inside the one-hour role session
    environment: aws-nonprod-session
    concurrency:
      group: aws-nonprod-database # never behind an approval in aws-terraform-nonprod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: gha-run-${{ github.run_id }}-db
          role-duration-seconds: 3600
          role-skip-session-tagging: true
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Stop the database
        env:
          DEPLOYER_ROLE_ARN: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
        run: |
          set -euo pipefail
          creds=$(aws sts assume-role --role-arn "$DEPLOYER_ROLE_ARN" --role-session-name "gha-run-$GITHUB_RUN_ID-db" --source-identity github-actions --query Credentials --output json)
          echo "::add-mask::$(jq -r .SecretAccessKey <<<"$creds")"
          echo "::add-mask::$(jq -r .SessionToken <<<"$creds")"
          AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$creds")
          AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$creds")
          AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$creds")
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          "$GITHUB_WORKSPACE/scripts/aws/stop-database.sh" "$DB_INSTANCE"

  session:
    name: Testing ${{ inputs.session || 'down' }}
    if: github.ref == 'refs/heads/main' && vars.AWS_CI_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 50 # inside the one-hour role session, so a hung step fails while it can still clean up
    concurrency:
      group: aws-terraform-nonprod # shared with aws-terraform.yml, so a session never races an apply
      cancel-in-progress: false
    # No required reviewer, so the evening backstop can run unattended; main only, and the plan
    # check above refuses anything but the session switches.
    environment: aws-nonprod-session
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws/stack
    env:
      SESSION: ${{ inputs.session || 'down' }}
      TF_VAR_deployer_role_arn: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
      TF_VAR_deployer_session_name: gha-run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: gha-run-${{ github.run_id }}
          role-duration-seconds: 3600
          role-skip-session-tagging: true
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      # The CI role can only assume the deployer; the database calls run as the deployer too.
      - name: Assume the deployer for the database calls
        id: deployer
        env:
          DEPLOYER_ROLE_ARN: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
        run: |
          set -euo pipefail
          creds=$(aws sts assume-role --role-arn "$DEPLOYER_ROLE_ARN" --role-session-name "gha-run-$GITHUB_RUN_ID" --source-identity github-actions --query Credentials --output json)
          {
            echo "::add-mask::$(jq -r .SecretAccessKey <<<"$creds")"
            echo "::add-mask::$(jq -r .SessionToken <<<"$creds")"
          }
          {
            echo "DEPLOYER_AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$creds")"
            echo "DEPLOYER_AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$creds")"
            echo "DEPLOYER_AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$creds")"
          } >> "$GITHUB_ENV"

      # The state object exists from the first apply (G3) on. Not found: nothing to take down.
      # The deployer may read nonprod/* and list the bucket, so a missing object is a 404; a 403 or
      # anything else is an error, never "not applied".
      - name: Does the nonprod stack exist
        id: stack
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$DEPLOYER_AWS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$DEPLOYER_AWS_SECRET_ACCESS_KEY" AWS_SESSION_TOKEN="$DEPLOYER_AWS_SESSION_TOKEN"
          bucket=$(sed -nE 's/^bucket[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' envs/nonprod.backend.hcl)
          key=$(sed -nE 's/^key[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' envs/nonprod.backend.hcl)
          [ -n "$bucket" ] && [ -n "$key" ] || { echo "::error::cannot read bucket and key from envs/nonprod.backend.hcl"; exit 1; }
          set +e
          err=$(aws s3api head-object --bucket "$bucket" --key "$key" 2>&1 >/dev/null)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "The nonprod stack state exists: s3://$bucket/$key"
          elif grep -q '(404)' <<<"$err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if [ "$SESSION" = up ]; then
              echo "::error::nonprod stack not applied yet (no s3://$bucket/$key): a session needs the G3 persistent layer"
              exit 1
            fi
            echo "::notice::nonprod stack not applied yet (no s3://$bucket/$key): nothing to take down"
          else
            echo "::error::cannot tell whether the nonprod stack exists: $err"
            exit 1
          fi

      - name: terraform init
        if: steps.stack.outputs.exists == 'true'
        env:
          DEPLOYER_ROLE_ARN: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
        run: |
          terraform init -input=false \
            -backend-config=envs/nonprod.backend.hcl \
            -backend-config="assume_role={role_arn=\"$DEPLOYER_ROLE_ARN\",session_name=\"gha-run-$GITHUB_RUN_ID\",source_identity=\"github-actions\"}"

      - name: Plan the switches
        if: steps.stack.outputs.exists == 'true'
        run: |
          set -euo pipefail
          on=$([ "$SESSION" = up ] && echo true || echo false)
          # The human-readable plan (attribute values) stays out of the public log; errors go to stderr.
          terraform plan -input=false -no-color -lock-timeout=5m -var-file=envs/nonprod.tfvars \
            -var "edge_enabled=$on" -var "services_enabled=$on" -out=tfplan > /dev/null
          terraform show -json tfplan > plan.json
          "$GITHUB_WORKSPACE/scripts/terraform/plan-summary.sh" plan.json | tee -a "$GITHUB_STEP_SUMMARY"
          # Anything beyond the session's own resource types stops the job before the apply. Every
          # security-group rule is persistent (R10), so none may change in a session.
          unexpected=$(jq -r '[.resource_changes[]
            | select(.change.actions != ["no-op"] and .change.actions != ["read"])
            | select(.type | IN("aws_lb","aws_lb_listener","aws_lb_listener_rule","aws_lb_target_group",
                                 "aws_acm_certificate_validation","aws_ecs_service",
                                 "aws_service_discovery_service") | not)
            | .address] | join(", ")' plan.json)
          rm -f plan.json
          [ -z "$unexpected" ] || { echo "::error::the session plan changes more than the session: $unexpected"; exit 1; }

      # After the plan check, so a refused `up` never starts the database.
      - name: Start the database
        if: env.SESSION == 'up' && steps.stack.outputs.exists == 'true'
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$DEPLOYER_AWS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$DEPLOYER_AWS_SECRET_ACCESS_KEY" AWS_SESSION_TOKEN="$DEPLOYER_AWS_SESSION_TOKEN"
          status=$(aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE" --query 'DBInstances[0].DBInstanceStatus' --output text)
          if [ "$status" = "stopped" ]; then aws rds start-db-instance --db-instance-identifier "$DB_INSTANCE" >/dev/null; fi
          aws rds wait db-instance-available --db-instance-identifier "$DB_INSTANCE"

      # stdout (resource ids, then every output) stays out of the public log; errors go to stderr.
      - name: Apply the switches
        if: steps.stack.outputs.exists == 'true'
        run: |
          terraform apply -input=false -no-color -lock-timeout=5m tfplan > /dev/null
          echo "Session $SESSION applied." | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs on `down` even when the plan or apply above failed (the database job has normally
      # stopped it already; this catches one the switches started), and on a failed `up`, so a
      # session that never came up does not keep the database running until the evening.
      - name: Stop the database
        if: >-
          always() && steps.deployer.outcome == 'success' && steps.stack.outputs.exists == 'true'
          && (env.SESSION == 'down' || (env.SESSION == 'up' && failure()))
        working-directory: .
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$DEPLOYER_AWS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$DEPLOYER_AWS_SECRET_ACCESS_KEY" AWS_SESSION_TOKEN="$DEPLOYER_AWS_SESSION_TOKEN"
          scripts/aws/stop-database.sh "$DB_INSTANCE"
