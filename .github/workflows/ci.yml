name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  # Also on push to main. Without this, main is ungated: a direct push — or a merge whose base
  # moved after the pull request last ran — lands with nothing checking it, and the first person
  # to notice is whoever opens the next pull request and inherits a red build they did not cause.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The design-system contract: the typed token surface and its CSS mirror must not
      # drift, and no product may rely on an export the contract does not promise.
      - name: Validate design-system contract
        run: pnpm validate

      - name: Format check
        run: pnpm format:check

  accessibility:
    name: Accessibility · contrast and keyboard, every story, four brands, light and dark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The browser is installed here rather than assumed. GitHub's runner image ships Chrome, but
      # the suite drives the Chromium that Playwright pins, so a developer's globally installed
      # browser is never what CI measures. `--with-deps` brings the shared libraries the headless
      # build needs on ubuntu-latest.
      - name: Install Chromium
        run: pnpm --filter @munaxa/platform exec playwright install --with-deps chromium

      # Static first: it is seconds rather than minutes, and it catches the one implementation
      # pattern Phases 8.2 and 8.4 each found repeatedly, before a browser is even started.
      - name: Readable text must not fade a foreground token
        run: pnpm --filter @munaxa/platform run check:faded

      # The suite measures the built site, not a dev server, so the build is a dependency rather
      # than an optimisation.
      - name: Build Storybook
        run: pnpm --filter @munaxa/platform run build-storybook

      # One command deliberately: `test:a11y` runs everything under `test/a11y/`, so the keyboard
      # matrix added in Phase 8.7 and the proofs that it can fail are enforced here without anyone
      # having to remember to add a step. A suite discovered by glob cannot be half-wired.
      - name: Accessibility matrix — contrast, keyboard, and the proofs behind both
        run: pnpm --filter @munaxa/platform run test:a11y

      # Only on failure: the run prints every failing story with its brand, scheme and selector, and
      # a green run has nothing worth keeping. Uploading the built site on failure lets the exact
      # story be opened locally at the commit that broke it.
      - name: Preserve the built Storybook for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/platform/storybook-static
          retention-days: 7

  facades:
    name: Façades match the platform surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # packages/{ui,tokens,icons,theme,typography,utils} are generated from
      # scripts/gen-facades.mjs. Regenerating must be a no-op — otherwise the published
      # package surface has drifted from the generator and consumers get a stale API.
      - name: Regenerate façades
        run: node scripts/gen-facades.mjs .

      - name: Fail if façades are stale
        run: |
          if ! git diff --quiet -- packages; then
            echo "::error::Façade packages are out of date. Run 'node scripts/gen-facades.mjs .' and commit the result."
            git diff --stat -- packages
            exit 1
          fi
